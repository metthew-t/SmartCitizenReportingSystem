version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-adama_reports_db}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_files:/app/media
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-adama_reports_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgrespassword}
      - SECRET_KEY=${DJANGO_SECRET_KEY:-change-this-in-production}
      - FIREBASE_SERVER_KEY=${FIREBASE_SERVER_KEY:-}
      - DEBUG=${DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations accounts core api &&
             python manage.py migrate &&
             python manage.py seed_departments &&
             python manage.py runserver 0.0.0.0:8000"

  web:
    build: ./web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/var/www/media:ro
    depends_on:
      - api
      - web

volumes:
  postgis_data:
  media_files:
