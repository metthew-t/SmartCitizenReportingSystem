services:
  - type: web
    name: adama-backend
    env: docker
    region: frankfurt # Can be changed depending on target region
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        sync: false # User must provide this in the Render dashboard from Neon
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "10"
