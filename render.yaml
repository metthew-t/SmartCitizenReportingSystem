services:
  - type: web
    name: adama-backend
    env: python
    region: frankfurt # Can be changed depending on target region
    buildCommand: "./backend/build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        sync: false # User must provide this in the Render dashboard from Neon
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
